<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recorrido Virtual - Compri Ayuda</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; }
        
        #blocker {
            position: absolute; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; z-index: 10;
        }
        #instructions {
            font-size: 30px; cursor: pointer; text-align: center;
            background: rgba(0,0,0,0.7); padding: 40px; border-radius: 10px; border: 2px solid white;
        }
        #loading { position: absolute; top: 10px; left: 10px; color: white; background: black; padding: 5px; }
        #coordinates { 
            position: absolute; 
            bottom: 10px; 
            left: 10px; 
            color: white; 
            background: rgba(0, 0, 0, 0.7); 
            padding: 10px 15px; 
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div id="loading">Cargando modelo...</div>
    <div id="coordinates">
        X: 0.00 | Y: 0.00 | Z: 0.00
    </div>

    <div id="blocker">
        <div id="instructions">
            <p style="font-size:40px">Haga CLIC para Entrar</p>
            <p>Moverse: W, A, S, D</p>
            <p>Mirar: Mouse</p>
            <p>Volar: R (Subir) / F (Bajar)</p>
            <p style="font-size:16px">(ESC para salir)</p>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let camera, scene, renderer, controls;
        
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let moveUp = false;
        let moveDown = false;
        
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        // Variables para producto
        let productToHighlight = null;
        let highlightedMesh = null;
        let highlightBox = null;
        let pulsePhase = 0;
        let productMeshMap = {};
        let redMaterial = null;

        // Variables para flechas
        let arrowMeshMap = {};
        let activeArrows = [];
        let arrowMaterials = [];
        let arrowPhase = 0;
        let arrowHeadPosition = 0;
        let rutasPerchas = {};
        let productoPercha = {};
        
        // Configuración de animación de flechas
        const ARROW_SPEED = 0.03;
        const ARROW_TRAIL_LENGTH = 3;

        init();
        animate();

        function init() {
            // CARGAR MAPEO DE PRODUCTOS (incluye rutas y perchas)
            fetch('/mapeo_productos.json')
                .then(response => {
                    if (!response.ok) throw new Error('Mapeo no encontrado');
                    return response.json();
                })
                .then(data => {
                    productMeshMap = data.productos || data;
                    rutasPerchas = data.rutas_perchas || {};
                    productoPercha = data.producto_percha || {};
                    console.log('Mapeo de productos cargado:', Object.keys(productMeshMap).length, 'productos');
                    console.log('Rutas de perchas cargadas:', Object.keys(rutasPerchas).length);
                })
                .catch(error => {
                    console.warn('No se pudo cargar mapeo de productos:', error);
                    productMeshMap = {};
                });

            // 1. Escena y Niebla
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 0, 75);

            // 2. Cámara
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            // POSICIÓN INICIAL FIJA + PRODUCTO A RESALTAR
            const params = new URLSearchParams(window.location.search);
            productToHighlight = params.get('producto'); 

            camera.position.set(6.19, -0.78, -2.60);
            
            if (productToHighlight) {
                console.log(`Producto a resaltar: ${productToHighlight}`);
            }

            // 3. Luces 
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2.0);
            hemiLight.position.set(0, 50, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 3.0); 
            dirLight.position.set(5, 50, 5);
            scene.add(dirLight);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            const flashLight = new THREE.PointLight(0xffffff, 0.5, 15);
            camera.add(flashLight);
            scene.add(camera);

            // 4. Controles
            controls = new PointerLockControls(camera, document.body);

            const blocker = document.getElementById('blocker');
            const instructions = document.getElementById('instructions');

            instructions.addEventListener('click', function () { controls.lock(); });
            controls.addEventListener('lock', function () {
                instructions.style.display = 'none';
                blocker.style.display = 'none';
            });
            controls.addEventListener('unlock', function () {
                blocker.style.display = 'flex';
                instructions.style.display = 'block';
            });

            scene.add(controls.getObject());

            // 5. Teclado
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight': case 'KeyD': moveRight = true; break;
                    case 'KeyR': moveUp = true; break;
                    case 'KeyF': moveDown = true; break;
                    
                    case 'KeyC':
                        const p = controls.getObject().position;
                        alert(`Coordenadas actuales:\nX: ${p.x.toFixed(2)}\nY: ${p.y.toFixed(2)}\nZ: ${p.z.toFixed(2)}`);
                        break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight': case 'KeyD': moveRight = false; break;
                    case 'KeyR': moveUp = false; break;
                    case 'KeyF': moveDown = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // 6. Cargar Modelo
            const loader = new GLTFLoader();
            loader.load('ACTUAL.glb', function (gltf) { 
                const object = gltf.scene;
                
                object.traverse(function(child) {
                    if (child.isMesh) child.material.side = THREE.DoubleSide;
                });

                const box = new THREE.Box3().setFromObject(object);
                const size = box.getSize(new THREE.Vector3());
                const maxAxis = Math.max(size.x, size.y, size.z);
                const scale = 20 / maxAxis; 
                object.scale.set(scale, scale, scale);
                
                const center = box.getCenter(new THREE.Vector3());
                object.position.y = -center.y * scale; 

                scene.add(object);
                document.getElementById('loading').innerText = "";

                // Indexar flechas del modelo
                indexarFlechas(object);
                
                // Ocultar todas las flechas inicialmente
                ocultarTodasFlechas();

                // RESALTAR PRODUCTO Y ACTIVAR FLECHAS
                if (productToHighlight) {
                    highlightProduct(object, productToHighlight);
                    activarRutaFlechas(productToHighlight);
                }

            }, undefined, function (error) {
                console.error(error);
                document.getElementById('loading').innerText = "Error al cargar modelo 3D";
            });

            // 7. Render
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        // === FUNCIONES PARA FLECHAS ===
        
        function indexarFlechas(model) {
            model.traverse(child => {
                const name = child.name.toLowerCase();
                if (name.includes('flecha')) {
                    // Indexar por nombre exacto y variantes
                    arrowMeshMap[name] = {
                        node: child,
                        originalMaterial: child.material
                    };
                    // También indexar por variantes sin puntos, guiones, etc.
                    let base = name.replace(/\./g, '_');
                    arrowMeshMap[base] = arrowMeshMap[name];
                    let noDigits = name.replace(/\.[0-9]+$/, '');
                    arrowMeshMap[noDigits] = arrowMeshMap[name];
                }
            });
            console.log('Flechas indexadas:', Object.keys(arrowMeshMap).length);
            console.log('Nombres indexados de flechas:');
            Object.keys(arrowMeshMap).forEach(n => console.log('  -', n));
        }

        function ocultarTodasFlechas() {
            for (const key in arrowMeshMap) {
                arrowMeshMap[key].node.visible = false;
            }
        }

        function activarRutaFlechas(productName) {
            // Obtener percha del producto
            const percha = productoPercha[productName];
            if (!percha) {
                console.warn('Percha no encontrada para:', productName);
                return;
            }

            // Obtener ruta de flechas para esa percha
            const ruta = rutasPerchas[percha];
            if (!ruta || ruta.length === 0) {
                console.warn('Ruta no encontrada para percha:', percha);
                return;
            }

            console.log(`Activando ruta para ${productName} -> Percha ${percha}:`, ruta);

            // Activar y animar flechas
            activeArrows = [];
            arrowMaterials = [];
            arrowHeadPosition = -1;

            ruta.forEach((flechaNombre, index) => {
                let key = flechaNombre.toLowerCase();
                let data = arrowMeshMap[key];

                // Buscar variante sin punto (ejemplo: flecha.001 → flecha001)
                if (!data) {
                    let noDot = key.replace(/\./g, '');
                    data = arrowMeshMap[noDot];
                }

                // Estrategia flexible: buscar variantes si no se encuentra
                if (!data) {
                    let alt1 = key.replace(/\./g, '_');
                    let alt2 = key.replace(/\.[0-9]+$/, '');
                    let alt3 = key.replace(/-/g, '_');
                    let alt4 = key.replace(/_/g, '');
                    let alt5 = key.replace(/flecha/gi, 'arrow');
                    data = arrowMeshMap[alt1] || arrowMeshMap[alt2] || arrowMeshMap[alt3] || arrowMeshMap[alt4] || arrowMeshMap[alt5];
                }

                if (data) {
                    data.node.visible = true;

                    const mat = new THREE.MeshStandardMaterial({
                        color: 0x00FF44,
                        emissive: 0x00FF44,
                        emissiveIntensity: 1.0,
                        transparent: true,
                        opacity: 0.9,
                        side: THREE.DoubleSide
                    });

                    data.node.traverse(sub => {
                        if (sub.isMesh) sub.material = mat;
                    });
                    if (data.node.isMesh) data.node.material = mat;

                    activeArrows.push({ node: data.node, index });
                    arrowMaterials.push(mat);
                } else {
                    console.warn('Flecha no encontrada:', flechaNombre);
                }
            });

            console.log('Flechas activas:', activeArrows.length);
        }

        function animarFlechas() {
            const total = activeArrows.length;
            if (total === 0) return;

            arrowHeadPosition += ARROW_SPEED;
            if (arrowHeadPosition > total + ARROW_TRAIL_LENGTH) {
                arrowHeadPosition = -1;
            }

            arrowPhase += 0.08;
            const globalPulse = Math.sin(arrowPhase) * 0.08 + 1.0;

            for (let i = 0; i < total; i++) {
                const mat = arrowMaterials[i];
                if (!mat) continue;

                const distToHead = arrowHeadPosition - i;

                if (i === total - 1) {
                    // Flecha destino: amarillo pulsante
                    const pulse = Math.sin(arrowPhase * 2.5) * 0.4 + 0.6;
                    mat.emissiveIntensity = (1.5 + pulse * 1.5) * globalPulse;
                    mat.color.setRGB(1.0, 0.85 * pulse + 0.15, 0.0);
                    mat.emissive.setRGB(0.9, 0.7 * pulse, 0);
                    mat.opacity = 0.85 + pulse * 0.15;

                } else if (i === 0) {
                    // Flecha inicio: cian
                    const pulse = Math.sin(arrowPhase * 1.5) * 0.3 + 0.7;
                    mat.emissiveIntensity = (1.0 + pulse * 0.8) * globalPulse;
                    mat.color.setRGB(0.0, 0.8 * pulse + 0.2, 1.0);
                    mat.emissive.setRGB(0, 0.6 * pulse, 0.8);
                    mat.opacity = 0.7 + pulse * 0.3;

                } else if (distToHead >= 0 && distToHead <= ARROW_TRAIL_LENGTH) {
                    // Estela de la cabeza viajera
                    const trail = 1.0 - (distToHead / ARROW_TRAIL_LENGTH);
                    const eased = trail * trail;
                    mat.emissiveIntensity = (0.15 + eased * 2.35) * globalPulse;
                    mat.color.setRGB(eased * 0.6, 0.3 + eased * 0.7, eased * 0.3);
                    mat.emissive.setRGB(eased * 0.3, 0.9 * (0.3 + eased * 0.7), eased * 0.15);
                    mat.opacity = 0.4 + eased * 0.6;

                } else {
                    // Flechas inactivas: verde tenue
                    mat.emissiveIntensity = 0.15 * globalPulse;
                    mat.color.setRGB(0, 0.25, 0.05);
                    mat.emissive.setRGB(0, 0.125, 0.025);
                    mat.opacity = 0.35;
                }
            }
        }

        // === FUNCIÓN PARA RESALTAR PRODUCTO ===

        function highlightProduct(sceneObject, productName) {
            console.log(`Buscando nodo para: "${productName}"`);
            
            // Limpiar highlight anterior si existe
            if (highlightBox) {
                sceneObject.remove(highlightBox);
                highlightBox.geometry.dispose();
                highlightBox.material.dispose();
                highlightBox = null;
            }
        
            let nodeNameToFind = productName.trim();
            
            // PRIMERO: Buscar en el mapeo de productos
            if (productMeshMap && productMeshMap[nodeNameToFind]) {
                nodeNameToFind = productMeshMap[nodeNameToFind];
                console.log(`Usando mapeo: "${productName}" → "${nodeNameToFind}"`);
            }
            
            let foundNode = null;
            
            // ESTRATEGIA DE BÚSQUEDA
            const searchStrategies = [
                nodeNameToFind,
                nodeNameToFind.replace(/\s+/g, '_'),
                nodeNameToFind.toLowerCase(),
                nodeNameToFind.replace(/\s+/g, '_').toLowerCase(),
                nodeNameToFind.replace(/\.\d+$/, ''),
                nodeNameToFind.replace(/\s+/g, '_').replace(/\.\d+$/, ''),
            ];
            
            for (let strategy of searchStrategies) {
                if (foundNode) break;
                sceneObject.traverse(function(child) {
                    if (!foundNode && child.name === strategy) {
                        foundNode = child;
                    }
                });
            }
            
            // Búsqueda case-insensitive
            if (!foundNode) {
                sceneObject.traverse(function(child) {
                    if (!foundNode && child.name.toLowerCase() === nodeNameToFind.toLowerCase()) {
                        foundNode = child;
                    }
                });
            }
            
            // Buscar por nombre base
            if (!foundNode) {
                let baseName = nodeNameToFind.replace(/\.\d+$/, '').replace(/\s+/g, '_').toLowerCase();
                sceneObject.traverse(function(child) {
                    if (!foundNode) {
                        let childBaseName = child.name.replace(/\.\d+$/, '').toLowerCase();
                        if (childBaseName === baseName) {
                            foundNode = child;
                        }
                    }
                });
            }
            
            // Buscar nodos que comiencen con el nombre
            if (!foundNode) {
                let baseName = nodeNameToFind.replace(/\.\d+$/, '').replace(/\s+/g, '_').toLowerCase();
                sceneObject.traverse(function(child) {
                    if (!foundNode) {
                        let childName = child.name.toLowerCase();
                        if (childName.startsWith(baseName) && 
                            (childName === baseName || 
                             childName.match(new RegExp(`^${baseName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}[_-]?\\d+$`)))) {
                            foundNode = child;
                        }
                    }
                });
            }
            
            if (foundNode) {
                console.log(`¡Nodo encontrado!: "${foundNode.name}"`);
                highlightedMesh = foundNode;

                foundNode.traverse(function(child) {
                    if (child.isMesh) {
                        redMaterial = new THREE.MeshStandardMaterial({
                            color: 0xFF0000,
                            emissive: 0xFF0000,
                            emissiveIntensity: 0.8,
                            transparent: false,
                            metalness: 0.3,
                            roughness: 0.4
                        });
                        child.material = redMaterial;
                    }
                });
                
                console.log(`Resaltado rojo aplicado a: ${foundNode.name}`);
                
            } else {
                console.warn(`No se encontró nodo para "${nodeNameToFind}".`);
                
                let similarNodes = [];
                let baseName = nodeNameToFind.replace(/\.\d+$/, '').split(/[\s_]/)[0].toLowerCase();
                
                sceneObject.traverse(function(child) {
                    if (child.name.toLowerCase().includes(baseName) && baseName.length > 2) {
                        similarNodes.push(child.name);
                    }
                });
                
                if (similarNodes.length > 0) {
                    console.log(`Nodos similares encontrados:`);
                    similarNodes.slice(0, 10).forEach(n => console.log(`   - ${n}`));
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();

            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= velocity.y * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.y = Number(moveUp) - Number(moveDown);
                direction.normalize();

                const speed = 80.0;
                if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;
                if (moveUp || moveDown) velocity.y -= direction.y * speed * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                controls.getObject().position.y += (velocity.y * delta);
                
                const pos = controls.getObject().position;
                document.getElementById('coordinates').innerText = 
                    `X: ${pos.x.toFixed(2)} | Y: ${pos.y.toFixed(2)} | Z: ${pos.z.toFixed(2)}`;
            }

            // Animación del producto (pulso rojo)
            if (highlightedMesh && redMaterial) {
                pulsePhase += 0.1;
                const pulse = Math.sin(pulsePhase) * 0.5 + 0.5;
                
                redMaterial.emissiveIntensity = 0.3 + (pulse * 1.5);
                const colorIntensity = 0.5 + (pulse * 0.5);
                redMaterial.color.setRGB(colorIntensity, 0, 0);
                const emissiveIntensity = 0.7 + (pulse * 0.3);
                redMaterial.emissive.setRGB(emissiveIntensity, 0, 0);
            }

            // Animación de flechas
            if (activeArrows.length > 0) {
                animarFlechas();
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
